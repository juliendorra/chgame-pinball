<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Midnight Pinball · Every popup</title><style>
*{box-sizing:border-box}body{margin:0;background:#10121b;color:#eef1f7;font:15px system-ui,sans-serif}header{position:sticky;top:0;z-index:2;padding:20px 28px;background:#10121bf5;border-bottom:1px solid #30364a}h1{font-size:23px;margin:0 0 6px}p{color:#aab3c9;margin:5px 0 16px}label{margin-right:12px}select,input,button{font:inherit;color:inherit;background:#212737;border:1px solid #454e68;border-radius:7px;padding:8px}main{max-width:1400px;margin:auto;padding:12px 28px 40px}section h2{font-size:18px;margin:26px 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.card{text-align:left;background:#191e2b;padding:14px;cursor:pointer}.card img{width:100%;image-rendering:pixelated;background:#11121e;margin:10px 0}.card strong{display:block}.card small{display:block;min-height:34px;color:#aab3c9;line-height:1.5}dialog{width:min(620px,95vw);max-height:95vh;color:inherit;background:#191e2b;border:1px solid #57617e;border-radius:12px;padding:20px}dialog::backdrop{background:#000b}dialog img{width:100%;image-rendering:pixelated}#close{float:right}dialog p{margin-top:12px}#count{display:inline-block;margin-top:12px;color:#aab3c9}.lcd{display:block;color:#b9dbff;margin-top:14px}a{color:#b9dbff}input{width:210px}@media(max-width:650px){header{position:static}select,input{margin-top:8px}main{padding:12px}}
</style><header><h1>Every Midnight Pinball popup</h1><p>Exact captures from the game renderer. Pick a theme; click a popup to see its animation.</p><label>Board <select id="theme"></select></label><label>Show <select id="group"><option>Everything</option></select></label><input id="search" placeholder="Find text or score…" aria-label="Search popups"><br><span id="count"></span></header><main id="main"></main><dialog id="detail"><button id="close">Close</button><h2 id="title"></h2><img id="animation" alt="Animated game popup"><p id="description"></p><a class="lcd" id="lcd" target="_blank">View full LCD capture ↗</a></dialog><script type="module">
const data=await(await fetch('gallery.json')).json();const $=s=>document.querySelector(s);const groups=[...new Set(data.cases.map(c=>c.group))];
for(const t of data.themes)$('#theme').add(new Option(t.title,t.id));for(const g of groups)$('#group').add(new Option(g));
function render(){const theme=$('#theme').value,query=$('#search').value.toLowerCase(),group=$('#group').value;$('#main').replaceChildren();let count=0;
for(const g of groups){const cases=data.cases.filter(c=>c.group===g&&(group==='Everything'||group===g)&&(c.title+' '+c.description+' '+c.value).toLowerCase().includes(query));if(!cases.length)continue;
const section=document.createElement('section'),heading=document.createElement('h2'),grid=document.createElement('div');heading.textContent=g;grid.className='grid';section.append(heading,grid);
for(const c of cases){count++;const card=document.createElement('button'),title=document.createElement('strong'),img=document.createElement('img'),desc=document.createElement('small');card.className='card';title.textContent=c.title;img.src=`assets/t${theme}-${c.slug}.png`;img.alt=c.title+' · '+c.description;img.loading='lazy';desc.textContent=c.description;card.append(title,img,desc);card.onclick=()=>{$('#title').textContent=c.title;$('#description').textContent=c.description;$('#animation').src=`assets/t${theme}-${c.slug}.gif`;$('#lcd').href=`assets/t${theme}-${c.slug}-lcd.png`;$('#detail').showModal()};grid.append(card)}$('#main').append(section)}$('#count').textContent=`${count} popups · 9 board themes · native game renderer`}
$('#theme').onchange=render;$('#group').onchange=render;$('#search').oninput=render;$('#close').onclick=()=>$('#detail').close();render();
</script></html>
