name: Check secure SFTP directory boundary
on:
  push:
    branches: [codex/secure-sftp-check]
    paths:
      - '.github/workflows/probe-sftp.yml'
      - 'tools/probe_sftp.py'
      - 'tools/deploy_known_hosts'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install -r tools/requirements-deploy.txt
      - name: Test actual directory permissions without reading file contents
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python tools/probe_sftp.py
