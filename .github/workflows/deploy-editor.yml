name: Build and deploy Pinball Studio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-editor.yml'
      - 'CHGame/**'
      - 'pinball.py'
      - 'requirements.txt'
      - 'save-config.json'
      - 'Pinball/*.ino'
      - 'Pinball/*.cpp'
      - 'Pinball/*.c'
      - 'Pinball/*.h'
      - 'Pinball/src/**'
      - 'Pinball/boards/**'
      - 'Pinball/sprites/**'
      - 'Pinball/sd/PINBALL/THEMES.PBA'
      - 'Pinball/editor/**'
      - 'Pinball/tools/wasm/**'
      - 'Pinball/tools/build_studio.py'
      - 'Pinball/tools/game.py'
      - 'Pinball/tools/sprites.py'
      - 'Pinball/tools/boards.py'
      - 'Pinball/tools/sim_build.py'
      - 'Pinball/tools/verify_wasm.mjs'
      - 'Pinball/tools/verify_browser_card.py'
      - 'Pinball/tools/verify_browser_card.mjs'
      - 'Pinball/tools/verify_sim.py'
      - 'Pinball/tools/verify_theme_assets.py'
      - 'Pinball/tools/verify_sd_scores.py'
      - 'Pinball/tools/verify_shake.py'
      - 'Pinball/tools/verify_flippers.py'
      - 'Pinball/tools/verify_regressions.py'
      - 'Pinball/tools/sanitizer.ignore'
      - 'tools/verify_deployed_site.py'
      - 'tools/deploy_sftp.py'
      - 'tools/test_deploy_sftp.py'
      - 'tools/deploy_known_hosts'
      - 'tools/deploy-target.json'
      - 'tools/requirements-deploy.txt'
      - 'tools/check_site_paths.py'
      - 'tools/sd_saves.py'
      - 'chgame-sd-saves/extras/CHSd/**'
      - 'chgame-sd-saves/src/**'
      - 'chgame-sd-saves/library.properties'

permissions:
  contents: read

concurrency:
  group: pinball-studio-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install pinned Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .toolchains/pinball-emsdk
          python .toolchains/pinball-emsdk/emsdk.py install 4.0.15
          python .toolchains/pinball-emsdk/emsdk.py activate 4.0.15
      - name: Build shared game and run parity and gameplay checks
        run: |
          python tools/check_site_paths.py
          python pinball.py web
          python pinball.py web-check
      - name: Install pinned SFTP client
        run: python -m pip install -r tools/requirements-deploy.txt
      - name: Test deployment checks
        run: python tools/test_deploy_sftp.py
      - name: Publish through pinned-host, directory-confined SFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python tools/deploy_sftp.py
      - name: Verify published build and WebAssembly MIME type
        run: python tools/verify_deployed_site.py https://juliendorra.com/chgame-pinball/
